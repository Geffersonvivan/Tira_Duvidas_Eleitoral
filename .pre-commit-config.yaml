# Roda ruff (lint + format) e pip-audit antes de cada commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff             # lint
        args: [--fix]
      - id: ruff-format      # format

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        args: [--skip-editable]
